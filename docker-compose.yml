# Milo on a NAS: SQL Server, the database deploy (runs once per "up" and exits) and the app.
# Put SQL_SA_PASSWORD in a .env file next to this one (see .env.example), then:  docker compose up -d --build

# The stack's name, fixed so the folder can be called anything: it prefixes the volumes (milo_sql, milo_data), so
# the same name always finds the same data. Never change it on a running install.
name: milo

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: milo-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
      # Keeps SQL Server from taking most of the NAS memory.
      MSSQL_MEMORY_LIMIT_MB: ${SQL_MEMORY_LIMIT_MB:-1024}
      TZ: Europe/Lisbon
    networks:
      - default
    ports:
      # For SSMS / Azure Data Studio / VS Code on the LAN (server: <nas-ip>,1434 · user: sa).
      - "${SQL_PORT:-1434}:1433"
    volumes:
      - sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Publishes the database project (tables, view and stored procedures) and exits: creates the Milo database the
  # first time, applies schema changes on later deploys.
  db-deploy:
    build:
      context: .
      dockerfile: BodyOps.Database/Dockerfile
    image: milo-db-deploy:latest
    container_name: milo-db-deploy
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - default
    environment:
      SQL_SERVER: sqlserver
      SQL_DATABASE: Milo
      SQL_USER: sa
      SQL_PASSWORD: ${SQL_SA_PASSWORD}

  milo:
    build:
      context: .
      dockerfile: BodyOps.WebApi/Dockerfile
    image: milo:latest
    container_name: milo
    restart: unless-stopped
    depends_on:
      db-deploy:
        condition: service_completed_successfully
    ports:
      - "${MILO_PORT:-${BODYOPS_PORT:-8086}}:8080"
    networks:
      - default   # to reach SQL Server
      - nas-net   # the NAS's shared network: Nginx Proxy Manager reaches the app at http://milo:8080
    environment:
      # The configuration keys keep the code's name (BodyOps); only the values matter here.
      ConnectionStrings__BodyOps: "Server=sqlserver,1433;Database=Milo;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      # Set to "false" once everyone who needs an account has one (the first account can always be created).
      BodyOps__AllowRegistration: ${MILO_ALLOW_REGISTRATION:-${BODYOPS_ALLOW_REGISTRATION:-true}}
      # Set to "true" when Nginx Proxy Manager (or another reverse proxy) sits in front of the app.
      BodyOps__BehindProxy: ${MILO_BEHIND_PROXY:-${BODYOPS_BEHIND_PROXY:-false}}
      BodyOps__TimeZone: Europe/Lisbon
      # Push reminders: "false" turns them off. The subject is how Apple, Google and Mozilla can reach whoever runs
      # this server (mailto: or an https URL); Apple refuses pushes without a valid one.
      BodyOps__PushEnabled: ${MILO_PUSH_ENABLED:-true}
      BodyOps__PushSubject: ${MILO_PUSH_SUBJECT:-https://github.com/rodrigocoelho2/Milo}
      TZ: Europe/Lisbon
    volumes:
      # Login keys: "keep me signed in" survives restarts and updates.
      - data:/data

networks:
  default:      # private network of this stack (SQL Server is not on nas-net)
  # Shared network on the NAS; create it once with:  docker network create nas-net
  nas-net:
    external: true

volumes:
  data:
  sql:
