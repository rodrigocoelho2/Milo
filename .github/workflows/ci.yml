name: CI

on:
  push:
    branches: [main, redesign]
  pull_request:
  workflow_dispatch:

# contents: write lets each job push its logs and screenshots to a ci-output-* branch for review.
permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SA_PASSWORD: BodyOps-CI-2026!

jobs:
  build-test:
    name: Build, database and tests
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Express
          MSSQL_SA_PASSWORD: BodyOps-CI-2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'BodyOps-CI-2026!' -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: mkdir -p ci-output && dotnet restore BodyOps.slnx 2>&1 | tee ci-output/1-restore.log

      - name: Build (Library, WebApi, UnitTest and the BodyOps.Database dacpac)
        run: |
          set -o pipefail
          dotnet build BodyOps.slnx -c Release --no-restore 2>&1 | tee ci-output/2-build.log
          dotnet build BodyOps.Database/BodyOps.Database.sqlproj -c Release 2>&1 | tee -a ci-output/2-build.log

      - name: Publish the dacpac to SQL Server
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          set -o pipefail
          exec > >(tee ci-output/3-dacpac.log) 2>&1
          dotnet tool install --global microsoft.sqlpackage
          dacpac=$(find BodyOps.Database/bin -name 'BodyOps.Database.dacpac' | head -n 1)
          sqlpackage /Action:Publish /SourceFile:"$dacpac" \
            /TargetServerName:localhost /TargetDatabaseName:BodyOps \
            /TargetUser:sa /TargetPassword:"$SA_PASSWORD" /TargetTrustServerCertificate:True \
            /p:BlockOnPossibleDataLoss=True
          # A second publish must find nothing to change.
          sqlpackage /Action:Publish /SourceFile:"$dacpac" \
            /TargetServerName:localhost /TargetDatabaseName:BodyOps \
            /TargetUser:sa /TargetPassword:"$SA_PASSWORD" /TargetTrustServerCertificate:True \
            /p:BlockOnPossibleDataLoss=True

      - name: Test (unit + SQL Server integration)
        env:
          BODYOPS_TEST_SQL: Server=localhost,1433;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True
        run: >-
          set -o pipefail;
          dotnet test BodyOps.UnitTest/BodyOps.UnitTest.csproj -c Release --no-build
          --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal" --results-directory TestResults
          2>&1 | tee ci-output/4-test.log

      - name: Push the logs to the ci-output-build branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/push-output.sh ci-output-build

  compose:
    name: Docker Compose end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start SQL Server, deploy the database and start the app
        run: |
          set -o pipefail
          mkdir -p ci-output
          echo "SQL_SA_PASSWORD=$SA_PASSWORD" > .env
          docker network create nas-net
          docker compose up -d --build --wait bodyops 2>&1 | tee ci-output/1-compose-up.log

      - name: Smoke test
        run: |
          exec > >(tee ci-output/2-smoke.log) 2>&1
          set -e
          base=http://localhost:8086
          for i in $(seq 1 60); do curl -fs $base/api/health && break; sleep 2; done
          echo
          curl -fs $base/ | grep -q "<title>Milo</title>"
          # Every stylesheet and script the page links must be served.
          for f in $(curl -fs $base/ | grep -oE '(href|src)="/(css|js|fonts|icons)/[^"]+"' | cut -d'"' -f2); do
            curl -fs -o /dev/null "$base$f" || { echo "missing: $f"; exit 1; }
          done
          curl -fs -o /dev/null $base/manifest.webmanifest
          jar=$(mktemp)
          curl -fs -c $jar -b $jar -H 'X-BodyOps: 1' -H 'Content-Type: application/json' \
            -d '{"username":"Rodas","password":"squat-2026"}' $base/api/auth/register
          echo
          curl -fs -c $jar -b $jar -X PUT -H 'X-BodyOps: 1' -H 'Content-Type: application/json' \
            -d '[{"name":"Pec deck","detail":"3x12"}]' $base/api/plan/2/exercises
          echo
          curl -fs -b $jar "$base/api/days/week" | head -c 400
          echo

      - name: Page screenshots
        run: |
          pip install --quiet playwright==1.55.0
          python -m playwright install --with-deps chromium > /dev/null
          set -o pipefail
          python .github/scripts/screenshots.py http://localhost:8086 ci-output/screenshots 2>&1 | tee ci-output/3-screenshots.log

      - name: Push the logs and screenshots to the ci-output-compose branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker compose ps -a > ci-output/9-compose-ps.log 2>&1 || true
          docker compose logs --no-color > ci-output/9-compose-logs.log 2>&1 || true
          .github/scripts/push-output.sh ci-output-compose
