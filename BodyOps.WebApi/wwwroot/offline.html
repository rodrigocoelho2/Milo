<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3355FF">
<title>Milo is offline</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #3355FF; color: #FFFFFF; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
  h1 { font-size: 24px; margin: 16px 0 6px; }
  p { color: rgba(255,255,255,.82); margin: 0 0 20px; max-width: 34ch; }
  button { background: #FFFFFF; color: #1F3BE0; border: 0; border-radius: 14px; padding: 13px 22px; font: 700 15px system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <img src="/icons/milo-icon.svg" width="64" height="64" alt="">
  <h1>Can’t reach Milo</h1>
  <p>Your server isn’t answering. Check that you’re online (or on your home network) and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
