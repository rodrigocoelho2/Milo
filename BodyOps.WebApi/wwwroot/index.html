<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" type="image/svg+xml" href="/icons/milo-icon.svg">

<meta name="mobile-web-app-capable" content="yes">

<script>

  try { document.documentElement.dataset.theme = localStorage.getItem('bodyops.theme') || 'system'; } catch (e) { }
</script>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/core.js" defer></script>

<script src="/js/main.js" defer></script>

<div id="app"><div class="loading"><div class="spinner" aria-label="Loading"></div></div></div>
